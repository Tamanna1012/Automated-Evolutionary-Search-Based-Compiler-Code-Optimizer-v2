<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Evolutionary Optimizer Dashboard</title>
<style>
:root{
  --bg:#f5f7fa; --panel:#ffffff; --text:#1c2733; --muted:#66727f; --line:#dfe4ea; --grid:#e6eaef;
  --accent:#2a6fb0; --accent2:#7a3fb0; --good:#1f8f55; --bad:#c0392b; --warn:#b7791f;
  --good-bg:#e5f5ec; --bad-bg:#fdeceb; --warn-bg:#fdf3dc; --code:#f0f3f7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161d; --panel:#18212b; --text:#e6ebf0; --muted:#93a1ae; --line:#2a3541; --grid:#26303b;
    --accent:#5aa3e6; --accent2:#b58be0; --good:#4cc283; --bad:#ef7b6e; --warn:#e0b058;
    --good-bg:#16342a; --bad-bg:#3a1f1d; --warn-bg:#3a2f14; --code:#0f151c;
  }
}
:root[data-theme="dark"]{
  --bg:#10161d; --panel:#18212b; --text:#e6ebf0; --muted:#93a1ae; --line:#2a3541; --grid:#26303b;
  --accent:#5aa3e6; --accent2:#b58be0; --good:#4cc283; --bad:#ef7b6e; --warn:#e0b058;
  --good-bg:#16342a; --bad-bg:#3a1f1d; --warn-bg:#3a2f14; --code:#0f151c;
}
*{box-sizing:border-box}
.grid>*,.cols>*,#detail>*,.card{min-width:0;max-width:100%}
svg{max-width:100%;height:auto;display:block}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 24px 8px;max-width:1280px;margin:0 auto;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px}
button,select,input{font:inherit;color:var(--text)}
select,input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.scroll{overflow-x:auto}
.theme{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
nav{max-width:1280px;margin:8px auto 0;padding:0 24px;display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--muted)}
nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1280px;margin:0 auto;padding:12px 24px 40px}
section.tab{display:none}
section.tab.active{display:block}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:650;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12px;margin-top:4px}
.badge{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:600}
.b-good{background:var(--good-bg);color:var(--good)} .b-bad{background:var(--bad-bg);color:var(--bad)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
h2{font-size:15px;margin:0 0 4px}
.hint{color:var(--muted);font-size:12px;margin:0 0 8px}
.explorer{grid-template-columns:330px 1fr;align-items:start}
@media (max-width:900px){.explorer{grid-template-columns:1fr}}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.filters input{grid-column:1/3}
.filters input,.filters select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
.plist{max-height:640px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.plist table{width:100%;border-collapse:collapse;font-size:12.5px}
.plist th{position:sticky;top:0;background:var(--panel);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--muted);font-weight:600}
.plist td{padding:5px 8px;border-bottom:1px solid var(--grid);white-space:nowrap}
.plist tr{cursor:pointer}
.plist tr:hover td{background:var(--code)}
.plist tr.sel td{background:var(--accent);color:#fff}
.plist tr.sel .muted{color:#e6f0fa}
.muted{color:var(--muted)}
pre{background:var(--code);border-radius:8px;padding:10px;margin:0;overflow:auto;font:12px/1.45 ui-monospace,Consolas,Menlo,monospace;max-height:340px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:5px 8px;border-bottom:1px solid var(--grid);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--muted);font-weight:600}
.chip{display:inline-block;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font:12px ui-monospace,Consolas,monospace}
.pass{color:var(--good);font-weight:700}.fail{color:var(--bad);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
svg text{fill:var(--muted);font-size:11px}
svg .lbl{fill:var(--text)}
.axisline{stroke:var(--line)} .gridline{stroke:var(--grid)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.checks{width:100%;border-collapse:collapse;font-size:13px}
.checks td,.checks th{padding:7px 9px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
textarea{width:100%;min-height:210px;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px;font:12.5px/1.45 ui-monospace,Consolas,Menlo,monospace;resize:vertical;color:var(--text)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 18px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}
.field{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.field input{width:90px}
.status{color:var(--muted);font-size:13px;margin-left:6px}
.errbox{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:8px 12px;margin-top:10px}
td.ok{color:var(--good);font-weight:700}
footer{max-width:1280px;margin:0 auto;padding:0 24px 24px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div>
    <h1>Automated Evolutionary Search-Based Compiler Code Optimizer</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <button class="theme" id="themeBtn" title="Toggle light / dark">Theme</button>
</header>
<nav id="nav">
  <button data-tab="overview" class="active">Overview</button>
  <button data-tab="explorer">Program explorer</button>
  <button data-tab="live">Live optimizer</button>
  <button data-tab="brief">Features</button>
</nav>
<main>
  <section class="tab active" id="tab-overview"></section>
  <section class="tab" id="tab-explorer"></section>
  <section class="tab" id="tab-live"></section>
  <section class="tab" id="tab-brief"></section>
</main>

const LIVE_SRC = {"__init__.py":"\"\"\"Automated Evolutionary Search-Based Compiler Code Optimizer (ECO).\"\"\"\n","tac.py":"\"\"\"Three-Address Code (TAC) representation used throughout the optimizer.\n\nAn instruction is a plain tuple so it is cheap to create, copy and hash\nduring the millions of GA evaluations performed across the population:\n\n    (\"input\", dest, name)     dest = <parameter name>\n    (\"const\", dest, value)    dest = <int literal>\n    (\"copy\",  dest, src)      dest = src\n    (\"bin\",   dest, op, a, b) dest = a <op> b        op in {'+','-','*','/'}\n    (\"output\", src)           emit(src)\n\nA TAC \"program\" is simply a list of such instructions, always in\nsingle-assignment-friendly straight-line form (no control flow), which is\nenough to exercise all six classic optimizations the assignment asks for.\n\"\"\"\nfrom __future__ import annotations\n\nfrom typing import List, Sequence, Tuple\n\nInstr = Tuple\nTAC = List[Instr]\n\nARITH_OPS = (\"+\", \"-\", \"*\", \"/\")\n\n\ndef dest_of(instr: Instr):\n    \"\"\"Return the variable an instruction defines, or None (e.g. output).\"\"\"\n    op = instr[0]\n    if op in (\"input\", \"const\", \"copy\", \"bin\"):\n        return instr[1]\n    return None\n\n\ndef uses_of(instr: Instr) -> Tuple[str, ...]:\n    \"\"\"Return the variables an instruction reads.\"\"\"\n    op = instr[0]\n    if op == \"copy\":\n        return (instr[2],)\n    if op == \"bin\":\n        return (instr[3], instr[4])\n    if op == \"output\":\n        return (instr[1],)\n    return ()\n\n\ndef clone(tac: Sequence[Instr]) -> TAC:\n    return list(tac)\n\n\ndef render_source(tac: Sequence[Instr], input_names: Sequence[str], func_name: str = \"prog\") -> str:\n    \"\"\"Render a pseudo-C rendition of the TAC for the \"source code\" field.\"\"\"\n    lines = [f\"int {func_name}({', '.join('int ' + n for n in input_names)}) {{\"]\n    for instr in tac:\n        op = instr[0]\n        if op == \"input\":\n            _, dest, name = instr\n            lines.append(f\"    int {dest} = {name};\")\n        elif op == \"const\":\n            _, dest, value = instr\n            lines.append(f\"    int {dest} = {value};\")\n        elif op == \"copy\":\n            _, dest, src = instr\n            lines.append(f\"    int {dest} = {src};\")\n        elif op == \"bin\":\n            _, dest, o, a, b = instr\n            lines.append(f\"    int {dest} = {a} {o} {b};\")\n        elif op == \"output\":\n            _, src = instr\n            lines.append(f\"    output({src});\")\n    lines.append(\"}\")\n    return \"\\n\".join(lines)\n\n\ndef tac_to_text(tac: Sequence[Instr]) -> str:\n    \"\"\"Compact one-instruction-per-line TAC listing, used in reports.\"\"\"\n    out = []\n    for instr in tac:\n        op = instr[0]\n        if op == \"input\":\n            out.append(f\"{instr[1]} = INPUT {instr[2]}\")\n        elif op == \"const\":\n            out.append(f\"{instr[1]} = {instr[2]}\")\n        elif op == \"copy\":\n            out.append(f\"{instr[1]} = {instr[2]}\")\n        elif op == \"bin\":\n            out.append(f\"{instr[1]} = {instr[3]} {instr[2]} {instr[4]}\")\n        elif op == \"output\":\n            out.append(f\"OUTPUT {instr[1]}\")\n    return \"\\n\".join(out)\n","interpreter.py":"\"\"\"A tiny TAC interpreter used both to check correctness and to simulate\nexecution time via a per-opcode cycle cost model.\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom typing import Dict, List, Sequence\n\nfrom .tac import Instr\n\n# Cycle cost model: add/sub are single-cycle ALU ops while multiply/divide\n# are modeled as costlier, matching typical instruction-latency intuitions\n# (add 1, multiply ~3). This gap is what makes strength reduction\n# (x*3 -> x+x+x) a genuine speed-for-size trade-off rather than a free win.\nCYCLE_COST = {\n    \"input\": 1,\n    \"const\": 1,\n    \"copy\": 1,\n    \"output\": 1,\n    \"bin+\": 1,\n    \"bin-\": 1,\n    \"bin*\": 3,\n    \"bin/\": 4,\n}\n\n\n@dataclass\nclass RunResult:\n    ok: bool\n    outputs: List[int] = field(default_factory=list)\n    cycles: int = 0\n    error: str = \"\"\n\n\ndef _safe_div(a: int, b: int) -> int:\n    \"\"\"Integer division truncated toward zero (C semantics); div-by-zero -> 0.\"\"\"\n    if b == 0:\n        return 0\n    q = a / b\n    return int(q) if q >= 0 else -int(-q)\n\n\ndef run(tac: Sequence[Instr], input_values: Dict[str, int]) -> RunResult:\n    \"\"\"Execute a straight-line TAC program and return outputs + cycle count.\"\"\"\n    env: Dict[str, int] = {}\n    outputs: List[int] = []\n    cycles = 0\n    try:\n        for instr in tac:\n            op = instr[0]\n            if op == \"input\":\n                _, dest, name = instr\n                env[dest] = int(input_values[name])\n                cycles += CYCLE_COST[\"input\"]\n            elif op == \"const\":\n                _, dest, value = instr\n                env[dest] = int(value)\n                cycles += CYCLE_COST[\"const\"]\n            elif op == \"copy\":\n                _, dest, src = instr\n                env[dest] = env[src]\n                cycles += CYCLE_COST[\"copy\"]\n            elif op == \"bin\":\n                _, dest, o, a, b = instr\n                va, vb = env[a], env[b]\n                if o == \"+\":\n                    env[dest] = va + vb\n                elif o == \"-\":\n                    env[dest] = va - vb\n                elif o == \"*\":\n                    env[dest] = va * vb\n                elif o == \"/\":\n                    env[dest] = _safe_div(va, vb)\n                else:\n                    raise ValueError(f\"unknown operator {o}\")\n                cycles += CYCLE_COST[\"bin\" + o]\n            elif op == \"output\":\n                _, src = instr\n                outputs.append(env[src])\n                cycles += CYCLE_COST[\"output\"]\n            else:\n                raise ValueError(f\"unknown opcode {op}\")\n        return RunResult(ok=True, outputs=outputs, cycles=cycles)\n    except Exception as exc:  # noqa: BLE001 - any interpreter fault means invalid genome\n        return RunResult(ok=False, outputs=[], cycles=cycles, error=str(exc))\n","metrics.py":"\"\"\"Multi-objective fitness metrics for a TAC program.\n\nFour objectives are tracked, all \"lower is better\":\n  * exec_time   - average simulated cycles across the benchmark's test-input sets\n  * instr_count - static number of TAC instructions\n  * code_size   - static weighted \"bytes\" a naive code generator would emit\n  * arith_ops   - static number of arithmetic ('bin') instructions\n\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom typing import Dict, List, Sequence\n\nfrom .interpreter import run\nfrom .tac import Instr\n\n# Weighted \"bytes\" per opcode, standing in for a naive bytecode emitter.\nCODE_SIZE_WEIGHT = {\n    \"input\": 2,\n    \"const\": 4,\n    \"copy\": 3,\n    \"bin\": 6,\n    \"output\": 3,\n}\n\n\n@dataclass\nclass Fitness:\n    exec_time: float\n    instr_count: int\n    code_size: int\n    arith_ops: int\n\n    def as_tuple(self):\n        return (self.exec_time, self.instr_count, self.code_size, self.arith_ops)\n\n    def as_dict(self):\n        return {\n            \"exec_time\": self.exec_time,\n            \"instr_count\": self.instr_count,\n            \"code_size\": self.code_size,\n            \"arith_ops\": self.arith_ops,\n        }\n\n\n@dataclass\nclass EvalResult:\n    fitness: Fitness\n    valid: bool\n    outputs_per_test: List[List[int]] = field(default_factory=list)\n\n\ndef static_metrics(tac: Sequence[Instr]):\n    instr_count = len(tac)\n    arith_ops = sum(1 for i in tac if i[0] == \"bin\")\n    code_size = sum(CODE_SIZE_WEIGHT[i[0]] for i in tac)\n    return instr_count, arith_ops, code_size\n\n\ndef evaluate(tac: Sequence[Instr], test_input_sets: Sequence[Dict[str, int]],\n             expected_outputs: Sequence[List[int]] = None) -> EvalResult:\n    \"\"\"Run the TAC on every test-input set and compute its fitness record.\n\n    `valid` is True iff the program runs without error on every test set and\n    (when `expected_outputs` is given) reproduces those outputs exactly -\n    this is the correctness check for evolved/optimized programs.\n    \"\"\"\n    instr_count, arith_ops, code_size = static_metrics(tac)\n\n    total_cycles = 0\n    outputs_per_test: List[List[int]] = []\n    valid = True\n    for idx, test_inputs in enumerate(test_input_sets):\n        result = run(tac, test_inputs)\n        if not result.ok:\n            valid = False\n            outputs_per_test.append([])\n            continue\n        total_cycles += result.cycles\n        outputs_per_test.append(result.outputs)\n        if expected_outputs is not None and result.outputs != list(expected_outputs[idx]):\n            valid = False\n\n    exec_time = total_cycles / len(test_input_sets) if test_input_sets else 0.0\n    fitness = Fitness(exec_time=exec_time, instr_count=instr_count,\n                       code_size=code_size, arith_ops=arith_ops)\n    return EvalResult(fitness=fitness, valid=valid, outputs_per_test=outputs_per_test)\n","individual.py":"\"\"\"Candidate program representation (\"individual\") for the GA population.\"\"\"\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass, field\nfrom typing import List\n\nfrom .metrics import Fitness\nfrom .tac import TAC\n\n\n@dataclass\nclass Individual:\n    genome: List[str]          # ordered optimizations applied to the original TAC\n    tac: TAC                   # the resulting program\n    fitness: Fitness           # (exec_time, instr_count, code_size, arith_ops)\n    valid: bool                # True iff outputs match the original on every test set\n    cost: float = 0.0          # scalar weighted cost, filled in by the GA for ranking\n\n    def fitness_tuple(self):\n        return self.fitness.as_tuple()\n","optimizations.py":"\"\"\"The eight TAC-level optimization passes the evolutionary search chooses from.\n\nEvery benchmark program is generated in single-assignment form (each\ntemporary is defined exactly once), which keeps the dataflow reasoning\nbelow correct without a full reaching-definitions analysis: a variable's\ndefining instruction is unique, so \"is this operand currently known to be\nconstant\" can be answered with a single forward scan.\n\nEach pass has the signature ``tac -> tac`` (pure, returns a new list) so a\ngenome (an ordered list of pass names) can simply be *replayed* from the\noriginal program to re-derive any individual's TAC.\n\"\"\"\nfrom __future__ import annotations\n\nfrom typing import Dict, List, Sequence\n\nfrom .tac import Instr, TAC, dest_of, uses_of\n\nCOMMUTATIVE = {\"+\", \"*\"}\n\n\ndef constant_folding(tac: Sequence[Instr]) -> TAC:\n    \"\"\"Fold arithmetic whose operands are already known literals.\n\n    Single-hop by design, like constant_propagation and copy_propagation\n    below: it only \"sees\" ``const`` instructions that existed before this\n    pass started, so a chain of dependent folds (e.g. ``t1 = c1+c2``, then\n    ``t2 = t1+c3``) needs constant_folding applied more than once - once\n    per link in the chain - to fully collapse. Combined with the tight\n    genome-length cap, this means a program with both a deep constant\n    chain *and* a deep copy chain cannot always fully clean up both within\n    one genome's budget, which is exactly the kind of scarcity that\n    produces genuinely non-dominated (Pareto) trade-offs rather than a\n    single dominant optimum.\n    \"\"\"\n    const_env: Dict[str, int] = {i[1]: i[2] for i in tac if i[0] == \"const\"}\n    out: TAC = []\n    for instr in tac:\n        op = instr[0]\n        if op == \"bin\" and instr[3] in const_env and instr[4] in const_env:\n            _, dest, o, a, b = instr\n            va, vb = const_env[a], const_env[b]\n            if o == \"+\":\n                value = va + vb\n            elif o == \"-\":\n                value = va - vb\n            elif o == \"*\":\n                value = va * vb\n            else:  # division - fold only when it divides evenly to stay simple/safe\n                if vb == 0 or va % vb != 0:\n                    out.append(instr)\n                    continue\n                value = va // vb\n            out.append((\"const\", dest, value))\n        else:\n            out.append(instr)\n    return out\n\n\ndef constant_propagation(tac: Sequence[Instr]) -> TAC:\n    \"\"\"Replace uses of known-constant variables with fresh literal defs.\n\n    Deliberately a *single-hop* rewrite (like a real optimizer pass run once\n    in a fixpoint loop): it only sees variables that were already literal\n    ``const`` instructions before this pass started, so a chain such as\n    ``c1 = 5; a = c1; b = a`` needs this pass applied more than once (i.e.\n    more than one genome slot, across mutation/crossover) to fully collapse\n    - which is what gives the genome's pass *order and repetition* real\n    consequences instead of every pass reaching its fixpoint in one shot.\n    \"\"\"\n    const_env: Dict[str, int] = {i[1]: i[2] for i in tac if i[0] == \"const\"}\n    out: TAC = []\n    fresh_id = [0]\n\n    def fresh_const(value: int) -> str:\n        fresh_id[0] += 1\n        name = f\"_pc{fresh_id[0]}\"\n        out.append((\"const\", name, value))\n        return name\n\n    for instr in tac:\n        op = instr[0]\n        if op == \"copy\" and instr[2] in const_env:\n            out.append((\"const\", instr[1], const_env[instr[2]]))\n        elif op == \"bin\":\n            _, dest, o, a, b = instr\n            na = fresh_const(const_env[a]) if a in const_env else a\n            nb = fresh_const(const_env[b]) if b in const_env else b\n            out.append((\"bin\", dest, o, na, nb))\n        else:\n            out.append(instr)\n    return out\n\n\ndef copy_propagation(tac: Sequence[Instr]) -> TAC:\n    \"\"\"Forward-substitute copies so later uses reference the copy's source.\n\n    Single-hop by design (see constant_propagation's docstring): a copy\n    chain of depth k needs this pass applied k times across the genome to\n    fully collapse, so genome order/repetition - not just which passes are\n    present - genuinely changes the result.\n    \"\"\"\n    direct = {i[1]: i[2] for i in tac if i[0] == \"copy\"}\n\n    out: TAC = []\n    for instr in tac:\n        op = instr[0]\n        if op == \"copy\":\n            out.append(instr)\n        elif op == \"bin\":\n            _, dest, o, a, b = instr\n            out.append((\"bin\", dest, o, direct.get(a, a), direct.get(b, b)))\n        elif op == \"output\":\n            out.append((\"output\", direct.get(instr[1], instr[1])))\n        else:\n            out.append(instr)\n    return out\n\n\ndef common_subexpression_elimination(tac: Sequence[Instr]) -> TAC:\n    \"\"\"Value-numbering CSE: reuse an earlier temp when the same value recurs.\n\n    Expressions are compared by the *values* of their operands, not their\n    names. A forward scan keeps a canonical name for every variable:\n\n    * ``d = copy s`` makes ``d`` an alias of ``s`` (looks through copies),\n    * a ``const`` equal to an earlier ``const`` aliases that earlier one,\n    * an expression recomputed from the same canonical operands is replaced\n      by a copy of the first result (commutative ops compare unordered).\n\n    Because aliases chain, a whole nested repeat such as\n    ``(((a+b)+c)+d)`` computed twice collapses in a single application:\n    the inner repeat becomes a copy, which makes the next level's operands\n    canonical-equal too, and so on. (The older name-based version rewrote\n    only one level per application, so deep repeats needed many genome\n    slots.) The now-redundant copies are left for copy propagation and dead\n    code elimination, as before.\n\n    If a name is ever defined twice (the passes can emit that - see\n    constant_propagation) every table is reset, which is always safe.\n    \"\"\"\n    canon: Dict[str, str] = {}      # variable -> canonical variable holding the same value\n    const_first: Dict[int, str] = {}\n    seen: Dict[tuple, str] = {}     # (op, canon a, canon b) -> variable computing it\n    defined = set()\n    out: TAC = []\n\n    def c(name: str) -> str:\n        return canon.get(name, name)\n\n    for instr in tac:\n        d = dest_of(instr)\n        if d is not None:\n            if d in defined:  # redefinition: forget everything, stay correct\n                canon.clear()\n                const_first.clear()\n                seen.clear()\n            defined.add(d)\n\n        op = instr[0]\n        if op == \"copy\":\n            canon[instr[1]] = c(instr[2])\n            out.append(instr)\n        elif op == \"const\":\n            first = const_first.setdefault(instr[2], instr[1])\n            canon[instr[1]] = first\n            out.append(instr)\n        elif op == \"bin\":\n            _, dest, o, a, b = instr\n            ca, cb = c(a), c(b)\n            key = (o,) + (tuple(sorted((ca, cb))) if o in COMMUTATIVE else (ca, cb))\n            if key in seen:\n                out.append((\"copy\", dest, seen[key]))\n                canon[dest] = c(seen[key])\n            else:\n                seen[key] = dest\n                out.append(instr)\n        else:\n            out.append(instr)\n    return out\n\n\ndef dead_code_elimination(tac: Sequence[Instr]) -> TAC:\n    \"\"\"Backward liveness sweep: drop definitions nothing ever uses.\"\"\"\n    live = set()\n    for instr in tac:\n        if instr[0] == \"output\":\n            live.update(uses_of(instr))\n\n    out: TAC = []\n    for instr in reversed(tac):\n        d = dest_of(instr)\n        if d is not None and d not in live:\n            continue  # dead definition, drop it\n        live.update(uses_of(instr))\n        out.append(instr)\n    out.reverse()\n    return out\n\n\ndef algebraic_simplification(tac: Sequence[Instr]) -> TAC:\n    \"\"\"Simplify identities such as x+0, x*1, x*0, x-0, x/1, x-x.\"\"\"\n    const_env: Dict[str, int] = {}\n    out: TAC = []\n    for instr in tac:\n        op = instr[0]\n        if op == \"const\":\n            const_env[instr[1]] = instr[2]\n            out.append(instr)\n            continue\n        if op != \"bin\":\n            out.append(instr)\n            continue\n\n        _, dest, o, a, b = instr\n        ca = const_env.get(a)\n        cb = const_env.get(b)\n        if o == \"+\":\n            if cb == 0:\n                out.append((\"copy\", dest, a))\n            elif ca == 0:\n                out.append((\"copy\", dest, b))\n            else:\n                out.append(instr)\n        elif o == \"-\":\n            if cb == 0:\n                out.append((\"copy\", dest, a))\n            elif a == b:\n                const_env[dest] = 0\n                out.append((\"const\", dest, 0))\n            else:\n                out.append(instr)\n        elif o == \"*\":\n            if cb == 0 or ca == 0:\n                const_env[dest] = 0\n                out.append((\"const\", dest, 0))\n            elif cb == 1:\n                out.append((\"copy\", dest, a))\n            elif ca == 1:\n                out.append((\"copy\", dest, b))\n            else:\n                out.append(instr)\n        elif o == \"/\":\n            if cb == 1:\n                out.append((\"copy\", dest, a))\n            elif a == b and cb != 0:\n                const_env[dest] = 1\n                out.append((\"const\", dest, 1))\n            else:\n                out.append(instr)\n        else:\n            out.append(instr)\n    return out\n\n\ndef _name_source(tac: Sequence[Instr], prefix: str):\n    \"\"\"Return a callable yielding variable names not defined anywhere in ``tac``.\"\"\"\n    taken = {dest_of(i) for i in tac if dest_of(i) is not None}\n    counter = [0]\n\n    def fresh() -> str:\n        while True:\n            counter[0] += 1\n            name = f\"{prefix}{counter[0]}\"\n            if name not in taken:\n                taken.add(name)\n                return name\n\n    return fresh\n\n\nSTRENGTH_REDUCTION_FACTORS = (2, 3, 4)\n\n\ndef strength_reduction(tac: Sequence[Instr]) -> TAC:\n    \"\"\"Replace ``x * k`` (k = 2, 3, 4) with a short chain of additions.\n\n    ``x*2 -> x+x``, ``x*3 -> (x+x)+x``, ``x*4 -> (x+x)+(x+x)``. Additions\n    are cheaper than a multiply in the cycle model, so ``exec_time`` drops -\n    but for k = 3, 4 the multiply becomes *two* arithmetic instructions, so\n    ``arith_ops`` and ``code_size`` go up. That is a genuine speed-for-size\n    trade-off (k = 2 is a pure win). The now-unused constant is left for\n    dead_code_elimination to remove.\n    \"\"\"\n    fresh = _name_source(tac, \"_sr\")\n    const_env: Dict[str, int] = {}  # forward scan: value of each name *at this point*\n    out: TAC = []\n    for instr in tac:\n        if instr[0] == \"bin\" and instr[2] == \"*\":\n            _, dest, _, a, b = instr\n            ka, kb = const_env.get(a), const_env.get(b)\n            if kb in STRENGTH_REDUCTION_FACTORS and ka is None:\n                x, k = a, kb\n            elif ka in STRENGTH_REDUCTION_FACTORS and kb is None:\n                x, k = b, ka\n            else:\n                x = None\n            if x is not None:\n                if k == 2:\n                    out.append((\"bin\", dest, \"+\", x, x))\n                elif k == 3:\n                    t = fresh()\n                    out.append((\"bin\", t, \"+\", x, x))\n                    out.append((\"bin\", dest, \"+\", t, x))\n                else:\n                    t = fresh()\n                    out.append((\"bin\", t, \"+\", x, x))\n                    out.append((\"bin\", dest, \"+\", t, t))\n                const_env.pop(dest, None)\n                continue\n        d = dest_of(instr)\n        if d is not None:\n            if instr[0] == \"const\":\n                const_env[d] = instr[2]\n            else:\n                const_env.pop(d, None)\n        out.append(instr)\n    return out\n\n\ndef multiply_fusion(tac: Sequence[Instr]) -> TAC:\n    \"\"\"Fuse repeated additions of the same value back into one multiply.\n\n    The size-oriented inverse of strength_reduction: ``(x+x)+x -> x*3`` and\n    ``(x+x)+(x+x) -> x*4``. It halves ``arith_ops`` for the chain and shrinks\n    ``code_size`` (once the leftover add is dead-code-eliminated) but a\n    multiply costs more cycles than the adds it replaces, so ``exec_time``\n    rises - the opposite corner of the speed/size trade-off. The needed\n    literal is reused if one is already defined, otherwise a fresh ``const``\n    is emitted.\n    \"\"\"\n    fresh = _name_source(tac, \"_mf\")\n    const_env: Dict[str, int] = {}\n    doubled: Dict[str, str] = {}  # t -> x for every live ``t = x + x``\n    out: TAC = []\n\n    def const_for(k: int) -> str:\n        for name, value in const_env.items():\n            if value == k:\n                return name\n        name = fresh()\n        out.append((\"const\", name, k))\n        const_env[name] = k\n        return name\n\n    def kill(name: str):\n        doubled.pop(name, None)\n        for t in [t for t, x in doubled.items() if x == name]:\n            del doubled[t]\n\n    for instr in tac:\n        if instr[0] == \"bin\" and instr[2] == \"+\":\n            _, dest, _, p, q = instr\n            x, k = None, None\n            if p == q and p in doubled:\n                x, k = doubled[p], 4\n            elif p in doubled and doubled[p] == q:\n                x, k = q, 3\n            elif q in doubled and doubled[q] == p:\n                x, k = p, 3\n            if x is not None and x != dest:\n                kname = const_for(k)\n                kill(dest)\n                const_env.pop(dest, None)\n                out.append((\"bin\", dest, \"*\", x, kname))\n                continue\n        d = dest_of(instr)\n        if d is not None:\n            kill(d)\n            if instr[0] == \"const\":\n                const_env[d] = instr[2]\n            else:\n                const_env.pop(d, None)\n            if instr[0] == \"bin\" and instr[2] == \"+\" and instr[3] == instr[4] != d:\n                doubled[d] = instr[3]\n        out.append(instr)\n    return out\n\n\nOPTIMIZATIONS = {\n    \"constant_folding\": constant_folding,\n    \"constant_propagation\": constant_propagation,\n    \"copy_propagation\": copy_propagation,\n    \"cse\": common_subexpression_elimination,\n    \"dead_code_elimination\": dead_code_elimination,\n    \"algebraic_simplification\": algebraic_simplification,\n    \"strength_reduction\": strength_reduction,\n    \"multiply_fusion\": multiply_fusion,\n}\n\nOPTIMIZATION_NAMES: List[str] = list(OPTIMIZATIONS.keys())\n\n\ndef apply_genome(original_tac: Sequence[Instr], genome: Sequence[str]) -> TAC:\n    \"\"\"Re-derive a TAC by replaying a genome's optimizations from scratch.\"\"\"\n    tac: TAC = list(original_tac)\n    for name in genome:\n        tac = OPTIMIZATIONS[name](tac)\n    return tac\n","pareto.py":"\"\"\"Pareto dominance and non-dominated front extraction over the four\nobjectives (exec_time, instr_count, code_size, arith_ops), all minimized.\"\"\"\nfrom __future__ import annotations\n\nfrom typing import List\n\nfrom .individual import Individual\n\n\ndef dominates(a: Individual, b: Individual) -> bool:\n    \"\"\"True if `a` is at least as good as `b` on every objective and\n    strictly better on at least one (i.e. a dominates b).\"\"\"\n    ta, tb = a.fitness_tuple(), b.fitness_tuple()\n    at_least_as_good = all(x <= y for x, y in zip(ta, tb))\n    strictly_better = any(x < y for x, y in zip(ta, tb))\n    return at_least_as_good and strictly_better\n\n\ndef distinct_fitness_points(front: List[Individual]) -> int:\n    \"\"\"How many *distinct* objective-space points the front covers - many\n    genomes can tie on the exact same fitness, so this is a more honest\n    measure of trade-off variety than the raw front size.\"\"\"\n    return len({ind.fitness_tuple() for ind in front})\n\n\ndef pareto_front(individuals: List[Individual]) -> List[Individual]:\n    \"\"\"Non-dominated set among the (valid) individuals given.\"\"\"\n    front = []\n    for cand in individuals:\n        if any(dominates(other, cand) for other in individuals if other is not cand):\n            continue\n        front.append(cand)\n    return front\n\n\n_LABELS = {\n    \"exec_time\": \"fastest (lowest exec_time)\",\n    \"instr_count\": \"fewest instructions\",\n    \"code_size\": \"smallest code size\",\n    \"arith_ops\": \"fewest arithmetic ops\",\n}\n\n\ndef describe_tradeoff(ind: Individual, front: List[Individual]) -> str:\n    \"\"\"Label what an individual on the Pareto front is best at, relative\n    to its front-mates.\"\"\"\n    labels = []\n    names = [\"exec_time\", \"instr_count\", \"code_size\", \"arith_ops\"]\n    for i, name in enumerate(names):\n        value = ind.fitness_tuple()[i]\n        if value == min(o.fitness_tuple()[i] for o in front):\n            labels.append(_LABELS[name])\n    if not labels:\n        return \"balanced trade-off\"\n    return \", \".join(labels)\n","ga.py":"\"\"\"The evolutionary search engine: population init, fitness evaluation,\ntournament selection + elitism, mutation, crossover and the generational\nloop, per the assignment's Evolutionary Algorithm Design section.\"\"\"\nfrom __future__ import annotations\n\nimport math\nimport random\nfrom dataclasses import dataclass, field\nfrom typing import Dict, List, Sequence\n\nfrom .individual import Individual\nfrom .metrics import evaluate\nfrom .optimizations import OPTIMIZATION_NAMES, apply_genome\nfrom .pareto import pareto_front\nfrom .tac import TAC\n\nDEFAULT_WEIGHTS = {\"exec_time\": 0.25, \"instr_count\": 0.25, \"code_size\": 0.25, \"arith_ops\": 0.25}\nINVALID_PENALTY = 1e6\nMAX_GENOME_LEN = 5\n\n\n@dataclass\nclass GAConfig:\n    pop_size: int = 30\n    num_generations: int = 50\n    elitism_frac: float = 0.10\n    tournament_k: int = 3\n    mutation_add_prob: float = 0.7\n    weights: Dict[str, float] = field(default_factory=lambda: dict(DEFAULT_WEIGHTS))\n    seed: int = 0\n\n\n@dataclass\nclass GenerationRecord:\n    generation: int\n    best_cost: float\n    avg_cost: float\n    pareto_front_size: int\n    valid_rate: float\n    elite_genomes: List[List[str]]\n    costs: List[float] = field(default_factory=list)  # whole-population costs, for distribution plots\n\n\n@dataclass\nclass GAResult:\n    history: List[GenerationRecord]\n    final_population: List[Individual]\n    best_individual: Individual\n    final_pareto_front: List[Individual]\n    generations_to_convergence: int\n    population_snapshots: List[List[Individual]] = field(default_factory=list)\n\n\ndef _random_genome(rng: random.Random) -> List[str]:\n    length = rng.randint(1, len(OPTIMIZATION_NAMES))\n    return rng.sample(OPTIMIZATION_NAMES, length)\n\n\ndef _mutate(genome: Sequence[str], rng: random.Random, add_prob: float) -> List[str]:\n    genome = list(genome)\n    if rng.random() < add_prob:\n        if len(genome) < MAX_GENOME_LEN:\n            pos = rng.randint(0, len(genome))\n            genome.insert(pos, rng.choice(OPTIMIZATION_NAMES))\n    else:\n        if genome:\n            genome.pop(rng.randrange(len(genome)))\n    return genome\n\n\ndef _crossover(g1: Sequence[str], g2: Sequence[str], rng: random.Random) -> List[str]:\n    if not g1 or not g2:\n        return list(g1) if g1 else list(g2)\n    cut = rng.randint(0, min(len(g1), len(g2)))\n    child = list(g1[:cut]) + list(g2[cut:])\n    return child[:MAX_GENOME_LEN]\n\n\ndef _tournament_select(population: List[Individual], rng: random.Random, k: int) -> Individual:\n    contenders = rng.sample(population, min(k, len(population)))\n    return min(contenders, key=lambda ind: ind.cost)\n\n\ndef build_individual(original_tac: TAC, genome: List[str], test_input_sets, expected_outputs,\n                      baseline_fitness, weights: Dict[str, float]) -> Individual:\n    tac = apply_genome(original_tac, genome)\n    result = evaluate(tac, test_input_sets, expected_outputs)\n    ind = Individual(genome=genome, tac=tac, fitness=result.fitness, valid=result.valid)\n    ind.cost = weighted_cost(ind, baseline_fitness, weights)\n    return ind\n\n\ndef weighted_cost(ind: Individual, baseline_fitness, weights: Dict[str, float]) -> float:\n    if not ind.valid:\n        return INVALID_PENALTY\n    bt = baseline_fitness.as_tuple()\n    it = ind.fitness_tuple()\n    names = [\"exec_time\", \"instr_count\", \"code_size\", \"arith_ops\"]\n    total = 0.0\n    for name, base_v, v in zip(names, bt, it):\n        base_v = base_v if base_v else 1.0\n        total += weights[name] * (v / base_v)\n    return total\n\n\ndef run_ga(original_tac: TAC, test_input_sets, expected_outputs, config: GAConfig = None) -> GAResult:\n    config = config or GAConfig()\n    rng = random.Random(config.seed)\n\n    baseline_eval = evaluate(original_tac, test_input_sets, expected_outputs)\n    baseline_fitness = baseline_eval.fitness\n\n    def make(genome: List[str]) -> Individual:\n        return build_individual(original_tac, genome, test_input_sets, expected_outputs,\n                                 baseline_fitness, config.weights)\n\n    population: List[Individual] = [make([])]  # original always kept\n    while len(population) < config.pop_size:\n        population.append(make(_random_genome(rng)))\n\n    n_elite = max(1, math.ceil(config.pop_size * config.elitism_frac))\n    history: List[GenerationRecord] = []\n    population_snapshots: List[List[Individual]] = []\n    best_cost_seen = math.inf\n    generations_to_convergence = 0\n\n    for gen in range(config.num_generations):\n        population.sort(key=lambda ind: ind.cost)\n        valid_pop = [ind for ind in population if ind.valid]\n        costs = [ind.cost for ind in valid_pop] or [ind.cost for ind in population]\n        best_cost = min(costs)\n        avg_cost = sum(costs) / len(costs)\n        front = pareto_front(valid_pop) if valid_pop else []\n        elites = population[:n_elite]\n        population_snapshots.append(list(population))\n\n        history.append(GenerationRecord(\n            generation=gen + 1,\n            best_cost=best_cost,\n            avg_cost=avg_cost,\n            pareto_front_size=len(front),\n            valid_rate=len(valid_pop) / len(population),\n            elite_genomes=[list(e.genome) for e in elites],\n            costs=[ind.cost for ind in population],\n        ))\n\n        if best_cost < best_cost_seen - 1e-9:\n            best_cost_seen = best_cost\n            generations_to_convergence = gen + 1\n\n        if gen == config.num_generations - 1:\n            break  # no need to breed a next generation after the last eval\n\n        next_population: List[Individual] = list(elites)\n        while len(next_population) < config.pop_size:\n            p1 = _tournament_select(population, rng, config.tournament_k)\n            p2 = _tournament_select(population, rng, config.tournament_k)\n            g1 = _mutate(p1.genome, rng, config.mutation_add_prob)\n            g2 = _mutate(p2.genome, rng, config.mutation_add_prob)\n            child_genome = _crossover(g1, g2, rng)\n            next_population.append(make(child_genome))\n        population = next_population\n\n    population.sort(key=lambda ind: ind.cost)\n    valid_final = [ind for ind in population if ind.valid]\n    best_individual = min(valid_final, key=lambda ind: ind.cost) if valid_final else population[0]\n    final_front = pareto_front(valid_final) if valid_final else []\n\n    return GAResult(\n        history=history,\n        final_population=population,\n        best_individual=best_individual,\n        final_pareto_front=final_front,\n        generations_to_convergence=generations_to_convergence,\n        population_snapshots=population_snapshots,\n    )\n","frontend.py":"\"\"\"Front end: compiles a straight-line Python function into the project's TAC.\n\nUses only the standard ``ast`` module and supports exactly what the kernel\nlibrary needs:\n\n  * one ``def`` whose parameters become ``input`` instructions\n  * assignments (``x = expr``, ``x += expr`` ...) to plain names\n  * expressions made of names, integer literals, ``+ - * //`` and unary ``-``\n  * ``return expr`` or ``return a, b, ...`` (each value becomes an ``output``)\n\n``//`` maps to the TAC ``/`` operator. Python's ``//`` floors while the TAC\ninterpreter truncates toward zero, so they agree whenever the quotient's\noperands are non-negative; the kernels that divide are therefore run on\npositive input domains, and every program is checked against the original\nPython source before it enters the dataset (see ``kernels.py``).\n\nThe code generator is deliberately naive, like an unoptimized compiler:\nno expression value is ever reused, so redundancy that is present in the\nsource (a repeated subexpression, a literal chain such as ``2 * 314``, an\nalias copy) survives into the TAC for the optimizer to find. The one thing\nit does like any real compiler is pool literals: each distinct integer\nvalue gets a single ``const`` instruction that every later use shares\n(otherwise two uses of ``9`` would be different variables and common\nsubexpression elimination could never match ``c * 9`` with ``c * 9``). Variables are renamed so\neach TAC destination is assigned exactly once (single-assignment form),\nwhich the optimization passes rely on.\n\"\"\"\nfrom __future__ import annotations\n\nimport ast\nfrom dataclasses import dataclass\nfrom typing import Dict, List, Optional, Tuple\n\nfrom .tac import TAC\n\n_BINOPS = {ast.Add: \"+\", ast.Sub: \"-\", ast.Mult: \"*\", ast.FloorDiv: \"/\"}\n\n\nclass UnsupportedSyntax(ValueError):\n    \"\"\"Raised when the source uses a construct the front end does not support.\"\"\"\n\n\n@dataclass\nclass CompiledFunction:\n    name: str\n    arg_names: List[str]\n    tac: TAC\n\n\nclass _Compiler:\n    def __init__(self):\n        self.tac: TAC = []\n        self.env: Dict[str, str] = {}   # python variable -> current TAC variable\n        self.defined = set()            # every TAC destination used so far\n        self._temp = 0\n        self._const = 0\n        self._pool: Dict[int, str] = {}  # literal value -> the const variable holding it\n\n    # -- naming -----------------------------------------------------------\n    def _fresh_temp(self) -> str:\n        self._temp += 1\n        return f\"_e{self._temp}\"\n\n    def _fresh_const(self) -> str:\n        self._const += 1\n        return f\"_k{self._const}\"\n\n    def _dest_for(self, py_name: str) -> str:\n        \"\"\"First assignment keeps the source name; later ones get a suffix (SSA).\"\"\"\n        if py_name not in self.defined:\n            name = py_name\n        else:\n            n = 1\n            while f\"{py_name}_{n}\" in self.defined:\n                n += 1\n            name = f\"{py_name}_{n}\"\n        self.defined.add(name)\n        return name\n\n    def _define(self, dest: str):\n        self.defined.add(dest)\n\n    # -- expressions ------------------------------------------------------\n    def expr(self, node: ast.AST, dest: Optional[str] = None) -> str:\n        \"\"\"Emit code for ``node`` and return the TAC variable holding its value.\n\n        When ``dest`` is given the final instruction defines exactly that name.\n        \"\"\"\n        if isinstance(node, ast.Constant):\n            if isinstance(node.value, bool) or not isinstance(node.value, int):\n                raise UnsupportedSyntax(f\"only integer literals are supported, got {node.value!r}\")\n            return self._emit_const(node.value, dest)\n\n        if isinstance(node, ast.Name):\n            if node.id not in self.env:\n                raise UnsupportedSyntax(f\"use of undefined variable '{node.id}'\")\n            src = self.env[node.id]\n            if dest is None:\n                return src  # a bare read needs no instruction\n            self.tac.append((\"copy\", dest, src))\n            return dest\n\n        if isinstance(node, ast.UnaryOp):\n            if isinstance(node.op, ast.UAdd):\n                return self.expr(node.operand, dest)\n            if isinstance(node.op, ast.USub):\n                if isinstance(node.operand, ast.Constant) and type(node.operand.value) is int:\n                    return self._emit_const(-node.operand.value, dest)\n                operand = self.expr(node.operand)\n                zero = self._emit_const(0, None)\n                out = dest or self._fresh_temp()\n                self.tac.append((\"bin\", out, \"-\", zero, operand))\n                return out\n            raise UnsupportedSyntax(f\"unsupported unary operator {type(node.op).__name__}\")\n\n        if isinstance(node, ast.BinOp):\n            op = _BINOPS.get(type(node.op))\n            if op is None:\n                raise UnsupportedSyntax(\n                    f\"unsupported operator {type(node.op).__name__} (use + - * //)\")\n            left = self.expr(node.left)\n            right = self.expr(node.right)\n            out = dest or self._fresh_temp()\n            self.tac.append((\"bin\", out, op, left, right))\n            return out\n\n        raise UnsupportedSyntax(f\"unsupported expression {type(node).__name__}\")\n\n    def _emit_const(self, value: int, dest: Optional[str]) -> str:\n        value = int(value)\n        if dest is None and value in self._pool:\n            return self._pool[value]\n        name = dest or self._fresh_const()\n        self.tac.append((\"const\", name, value))\n        self._pool.setdefault(value, name)\n        return name\n\n    # -- statements -------------------------------------------------------\n    def assign(self, py_name: str, value: ast.AST):\n        # evaluate the right-hand side first (it may read the old binding)\n        dest = self._dest_for(py_name)\n        result = self.expr(value, dest)\n        assert result == dest\n        self.env[py_name] = dest\n\n    def statement(self, stmt: ast.stmt):\n        if isinstance(stmt, ast.Assign):\n            if len(stmt.targets) != 1 or not isinstance(stmt.targets[0], ast.Name):\n                raise UnsupportedSyntax(\"only simple 'name = expr' assignments are supported\")\n            self.assign(stmt.targets[0].id, stmt.value)\n        elif isinstance(stmt, ast.AugAssign):\n            if not isinstance(stmt.target, ast.Name):\n                raise UnsupportedSyntax(\"only simple 'name op= expr' is supported\")\n            fake = ast.BinOp(left=ast.Name(id=stmt.target.id, ctx=ast.Load()), op=stmt.op, right=stmt.value)\n            self.assign(stmt.target.id, fake)\n        elif isinstance(stmt, ast.Return):\n            if stmt.value is None:\n                raise UnsupportedSyntax(\"a bare 'return' is not supported\")\n            values = stmt.value.elts if isinstance(stmt.value, ast.Tuple) else [stmt.value]\n            for v in values:\n                self.tac.append((\"output\", self.expr(v)))\n        elif isinstance(stmt, ast.Expr) and isinstance(stmt.value, ast.Constant):\n            return  # docstring\n        else:\n            raise UnsupportedSyntax(f\"unsupported statement {type(stmt).__name__}\")\n\n\ndef compile_function(source: str) -> CompiledFunction:\n    \"\"\"Compile the single function defined in ``source`` to TAC.\"\"\"\n    module = ast.parse(source)\n    funcs = [n for n in module.body if isinstance(n, ast.FunctionDef)]\n    if len(funcs) != 1 or len(module.body) != 1:\n        raise UnsupportedSyntax(\"source must contain exactly one function definition\")\n    fn = funcs[0]\n    if fn.args.vararg or fn.args.kwarg or fn.args.kwonlyargs or fn.args.defaults:\n        raise UnsupportedSyntax(\"only plain positional parameters are supported\")\n\n    comp = _Compiler()\n    arg_names = [a.arg for a in fn.args.args]\n    for name in arg_names:\n        dest = comp._dest_for(name)\n        comp.tac.append((\"input\", dest, name))\n        comp.env[name] = dest\n    for stmt in fn.body:\n        comp.statement(stmt)\n    if not any(i[0] == \"output\" for i in comp.tac):\n        raise UnsupportedSyntax(\"function must return at least one value\")\n    return CompiledFunction(name=fn.name, arg_names=arg_names, tac=comp.tac)\n\n\ndef run_source(source: str, func_name: str, inputs: Dict[str, int]) -> List[int]:\n    \"\"\"Ground truth: execute the ORIGINAL Python source and return its outputs.\"\"\"\n    namespace: dict = {}\n    exec(compile(source, f\"<kernel {func_name}>\", \"exec\"), {\"__builtins__\": {}}, namespace)  # noqa: S102\n    result = namespace[func_name](**inputs)\n    if isinstance(result, tuple):\n        return [int(v) for v in result]\n    return [int(result)]\n","live.py":"\"\"\"Live optimization of a user-supplied function, for the dashboard.\n\n``optimize_source`` is the exact same pipeline the experiment uses -\n``ast`` front end, ground truth from running the original Python source,\nthe genetic algorithm, Pareto analysis, output verification - packaged as a\nsingle call that returns plain JSON-serialisable data. The dashboard runs\nthis file inside Pyodide (Python compiled to WebAssembly) so a visitor's\nfunction is compiled, optimized and checked in their own browser; nothing\nis sent to a server.\n\nIt deliberately imports only modules with no third-party dependencies.\n\"\"\"\nfrom __future__ import annotations\n\nimport json\nimport random\nfrom typing import List\n\nfrom .frontend import UnsupportedSyntax, compile_function, run_source\nfrom .ga import GAConfig, run_ga\nfrom .interpreter import run\nfrom .metrics import evaluate\nfrom .pareto import describe_tradeoff\nfrom .tac import tac_to_text\n\nMAX_POP = 50\nMAX_GENS = 50\nNUM_TESTS = 5\n\n\ndef _error(message: str) -> dict:\n    return {\"ok\": False, \"error\": message}\n\n\ndef optimize_source(source: str, lo: int = 1, hi: int = 20, pop: int = 30,\n                    gens: int = 30, seed: int = 42) -> dict:\n    \"\"\"Compile ``source`` (one straight-line integer function), evolve optimized\n    versions of it and return everything the dashboard shows.\"\"\"\n    pop = max(10, min(int(pop), MAX_POP))\n    gens = max(2, min(int(gens), MAX_GENS))\n    lo, hi = int(lo), int(hi)\n    if lo > hi:\n        lo, hi = hi, lo\n\n    try:\n        compiled = compile_function(source)\n    except UnsupportedSyntax as exc:\n        return _error(f\"Unsupported code: {exc}\")\n    except SyntaxError as exc:\n        return _error(f\"Syntax error: {exc.msg} (line {exc.lineno})\")\n    if not compiled.arg_names:\n        return _error(\"The function needs at least one parameter.\")\n\n    rng = random.Random(seed)\n    tests = [{a: rng.randint(lo, hi) for a in compiled.arg_names} for _ in range(NUM_TESTS)]\n\n    expected: List[List[int]] = []\n    for inputs in tests:\n        try:\n            expected.append(run_source(source, compiled.name, inputs))\n        except Exception as exc:  # noqa: BLE001 - report any failure of the user's function\n            return _error(f\"Your function failed on {inputs}: {type(exc).__name__}: {exc}\")\n    for inputs, want in zip(tests, expected):\n        got = run(compiled.tac, inputs)\n        if not got.ok or got.outputs != want:\n            return _error(\n                f\"The compiled code disagrees with Python on {inputs} (Python: {want}, compiled: {got.outputs}). \"\n                \"This usually means '//' was applied to a negative number (Python floors, the optimizer \"\n                \"truncates toward zero) - use a positive input range.\")\n\n    baseline = evaluate(compiled.tac, tests, expected).fitness\n    result = run_ga(compiled.tac, tests, expected, GAConfig(pop_size=pop, num_generations=gens, seed=seed))\n    best = result.best_individual\n\n    front = result.final_pareto_front\n    front_ids = {id(i) for i in front}\n    by_point = {}\n    for ind in front:\n        by_point.setdefault(ind.fitness_tuple(), []).append(ind)\n    pareto = [{\"genome\": inds[0].genome, \"fitness\": inds[0].fitness.as_dict(),\n               \"label\": describe_tradeoff(inds[0], front), \"tied\": len(inds)}\n              for inds in sorted(by_point.values(), key=lambda g: g[0].fitness_tuple())]\n\n    checks = []\n    for inputs, want in zip(tests, expected):\n        got = run(best.tac, inputs)\n        checks.append({\"inputs\": inputs, \"expected\": want, \"optimized\": got.outputs,\n                       \"match\": bool(got.ok and got.outputs == want)})\n\n    imp = 0.0\n    if baseline.exec_time:\n        imp = 100.0 * (baseline.exec_time - best.fitness.exec_time) / baseline.exec_time\n    return {\n        \"ok\": True,\n        \"function\": compiled.name,\n        \"args\": compiled.arg_names,\n        \"settings\": {\"lo\": lo, \"hi\": hi, \"pop\": pop, \"gens\": gens, \"seed\": seed},\n        \"tac_before\": tac_to_text(compiled.tac).splitlines(),\n        \"tac_after\": tac_to_text(best.tac).splitlines(),\n        \"genome\": list(best.genome),\n        \"baseline\": baseline.as_dict(),\n        \"best\": best.fitness.as_dict(),\n        \"improvement_pct\": imp,\n        \"best_cost\": best.cost,\n        \"generations_to_convergence\": result.generations_to_convergence,\n        \"hist_best\": [round(r.best_cost, 5) for r in result.history],\n        \"hist_avg\": [round(r.avg_cost, 5) for r in result.history],\n        \"valid_rate_final\": result.history[-1].valid_rate,\n        \"front_size\": len(front),\n        \"distinct_points\": len(pareto),\n        \"population\": [[i.fitness.exec_time, i.fitness.instr_count, i.fitness.code_size,\n                        i.fitness.arith_ops, 1 if id(i) in front_ids else 0, 1 if i.valid else 0]\n                       for i in result.final_population],\n        \"pareto\": pareto,\n        \"checks\": checks,\n        \"verdict\": \"PASS\" if best.valid and all(c[\"match\"] for c in checks) else \"FAIL\",\n    }\n\n\ndef optimize_json(params_json: str) -> str:\n    \"\"\"JSON in, JSON out: the single entry point the browser calls.\"\"\"\n    p = json.loads(params_json)\n    try:\n        out = optimize_source(p[\"source\"], p.get(\"lo\", 1), p.get(\"hi\", 20), p.get(\"pop\", 30),\n                              p.get(\"gens\", 30), p.get(\"seed\", 42))\n    except RecursionError:\n        out = _error(\"The expression is too deeply nested.\")\n    return json.dumps(out)\n"};
</script>
<script>
(function(){
"use strict";
const P = DATA.programs, A = DATA.aggregate, M = DATA.meta;
const NS = "http://www.w3.org/2000/svg";
const $ = (s, r=document) => r.querySelector(s);
const fmt = (v, d=1) => (v === null || v === undefined || Number.isNaN(v)) ? "n/a" : Number(v).toFixed(d);
const mean = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})) {
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
function sv(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for (const k in (attrs||{})) e.setAttribute(k, attrs[k]);
  if (parent) parent.append(e);
  return e;
}
function ticks(lo, hi, n){
  if (hi === lo) { hi = lo + 1; }
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw) || 10*mag;
  const out = []; for (let v = Math.ceil(lo/step)*step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function frame(w, hgt, m){
  const s = sv("svg", {viewBox:`0 0 ${w} ${hgt}`, width:"100%", role:"img"});
  return {s, w, h:hgt, m, iw:w-m.l-m.r, ih:hgt-m.t-m.b};
}
function axes(f, xr, yr, xl, yl, xt=6, yt=5, xfmt=v=>v, yfmt=v=>v){
  const X = v => f.m.l + (v-xr[0])/(xr[1]-xr[0]||1)*f.iw;
  const Y = v => f.m.t + f.ih - (v-yr[0])/(yr[1]-yr[0]||1)*f.ih;
  for (const t of ticks(yr[0], yr[1], yt)) {
    sv("line", {x1:f.m.l, x2:f.m.l+f.iw, y1:Y(t), y2:Y(t), class:"gridline"}, f.s);
    sv("text", {x:f.m.l-6, y:Y(t)+4, "text-anchor":"end"}, f.s).textContent = yfmt(t);
  }
  for (const t of ticks(xr[0], xr[1], xt)) {
    sv("text", {x:X(t), y:f.m.t+f.ih+16, "text-anchor":"middle"}, f.s).textContent = xfmt(t);
  }
  sv("line", {x1:f.m.l, x2:f.m.l+f.iw, y1:f.m.t+f.ih, y2:f.m.t+f.ih, class:"axisline"}, f.s);
  sv("line", {x1:f.m.l, x2:f.m.l, y1:f.m.t, y2:f.m.t+f.ih, class:"axisline"}, f.s);
  sv("text", {x:f.m.l+f.iw/2, y:f.h-4, "text-anchor":"middle"}, f.s).textContent = xl;
  const yt2 = sv("text", {transform:`translate(12 ${f.m.t+f.ih/2}) rotate(-90)`, "text-anchor":"middle"}, f.s);
  yt2.textContent = yl;
  return {X, Y};
}
function pad(lo, hi, p=0.08){ const d = (hi-lo)||Math.abs(hi)||1; return [lo-d*p, hi+d*p]; }

function lineChart(series, xl, yl){
  const n = series[0].values.length;
  const all = series.flatMap(s=>s.values);
  const yr = pad(Math.min(...all), Math.max(...all));
  const f = frame(560, 260, {l:48,r:12,t:10,b:34});
  const {X,Y} = axes(f, [1,n], yr, xl, yl, 8, 5, v=>Math.round(v), v=>fmt(v,2));
  for (const s of series){
    sv("polyline", {points:s.values.map((v,i)=>`${X(i+1)},${Y(v)}`).join(" "), fill:"none", stroke:s.color, "stroke-width":2}, f.s);
    s.values.forEach((v,i)=>{ if (n<=60) sv("circle",{cx:X(i+1),cy:Y(v),r:2.2,fill:s.color},f.s); });
  }
  return f.s;
}
function scatter(points, xl, yl, opts={}){
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const xr = opts.xr || pad(Math.min(...xs), Math.max(...xs), .1), yr = opts.yr || pad(Math.min(...ys), Math.max(...ys), .1);
  const f = frame(opts.w||560, opts.h||280, {l:52,r:14,t:10,b:36});
  const {X,Y} = axes(f, xr, yr, xl, yl, 6, 5, v=>fmt(v, opts.xd ?? 0), v=>fmt(v, opts.yd ?? 0));
  if (opts.diag) sv("line",{x1:X(opts.diag[0]),y1:Y(opts.diag[0]),x2:X(opts.diag[1]),y2:Y(opts.diag[1]),stroke:"var(--muted)","stroke-dasharray":"4 4"},f.s);
  const draw = (pts, fill, r, op) => pts.forEach(p=>{ const c = sv("circle",{cx:X(p.x),cy:Y(p.y),r,fill,"fill-opacity":op,stroke:"var(--panel)","stroke-width":.8},f.s); if (p.tip) sv("title",{},c).textContent=p.tip; });
  draw(points.filter(p=>!p.front), opts.color || "var(--muted)", opts.r || 4, opts.op ?? .55);
  draw(points.filter(p=>p.front), "var(--bad)", 6, 1);
  return f.s;
}
function barsH(items, xl, opts={}){
  const rowH = 17, f = frame(560, items.length*rowH+34, {l:opts.lm||170,r:44,t:6,b:26});
  const max = Math.max(...items.map(i=>i.value), 1);
  const X = v => f.m.l + v/max*f.iw;
  for (const t of ticks(0, max, 5)) {
    sv("line",{x1:X(t),x2:X(t),y1:f.m.t,y2:f.m.t+items.length*rowH,class:"gridline"},f.s);
    sv("text",{x:X(t),y:f.m.t+items.length*rowH+14,"text-anchor":"middle"},f.s).textContent = t;
  }
  items.forEach((it,i)=>{
    const y = f.m.t + i*rowH;
    sv("rect",{x:f.m.l,y:y+2,width:Math.max(X(it.value)-f.m.l,0),height:rowH-5,rx:3,fill:it.color||"var(--accent)"},f.s);
    sv("text",{x:f.m.l-6,y:y+rowH-5,"text-anchor":"end",class:"lbl"},f.s).textContent = it.label;
    sv("text",{x:X(it.value)+5,y:y+rowH-5},f.s).textContent = fmt(it.value,1);
  });
  sv("text",{x:f.m.l+f.iw/2,y:f.h-2,"text-anchor":"middle"},f.s).textContent = xl;
  return f.s;
}
function barsV(items, xl, yl){
  const f = frame(560, 250, {l:48,r:12,t:10,b:56});
  const max = Math.max(...items.map(i=>i.value), 1);
  const bw = f.iw/items.length;
  const Y = v => f.m.t + f.ih - v/max*f.ih;
  for (const t of ticks(0, max, 5)) {
    sv("line",{x1:f.m.l,x2:f.m.l+f.iw,y1:Y(t),y2:Y(t),class:"gridline"},f.s);
    sv("text",{x:f.m.l-6,y:Y(t)+4,"text-anchor":"end"},f.s).textContent = t;
  }
  items.forEach((it,i)=>{
    const x = f.m.l + i*bw;
    sv("rect",{x:x+4,y:Y(it.value),width:bw-8,height:f.m.t+f.ih-Y(it.value),rx:3,fill:it.color||"var(--accent)"},f.s);
    sv("text",{x:x+bw/2,y:Y(it.value)-4,"text-anchor":"middle",class:"lbl"},f.s).textContent = it.value;
    sv("text",{x:x+bw/2,y:f.m.t+f.ih+15,"text-anchor":"middle"},f.s).textContent = it.label;
  });
  sv("text",{x:f.m.l+f.iw/2,y:f.h-4,"text-anchor":"middle"},f.s).textContent = xl;
  const t = sv("text",{transform:`translate(12 ${f.m.t+f.ih/2}) rotate(-90)`,"text-anchor":"middle"},f.s); t.textContent = yl;
  return f.s;
}
const legend = items => h("div",{class:"legend"}, items.map(([c,t])=>h("span",{},h("i",{style:`background:${c}`}),t)));

function overviewCharts(){

  // by kernel

  cards.push(h("div",{class:"card"}, h("h2",{},"Average improvement by kernel"),

  if (sp.length) cards.push(h("div",{class:"card"}, h("h2",{},"By kernel spelling"),
    h("p",{class:"hint"},"naive = redundant spelling (recomputes inline); tidy = names the intermediate; plain = single form."), barsH(sp,"improvement (%)",{lm:110})));
  // sim vs measured
  if (hasRT){
    const pts = P.map(p=>({x:p.improvement_pct,y:p.runtime.measured_improvement_pct,tip:`${p.name} (${p.kernel})`}));
    const c = A.correlation||{};
    cards.push(h("div",{class:"card"}, h("h2",{},"Simulated vs measured improvement"),
      h("p",{class:"hint"},`Each dot is a program. Dashed line = perfect agreement. Pearson ${fmt(c.improvement_pearson,2)}, Spearman ${fmt(c.improvement_spearman,2)}.`),
      scatter(pts,"simulated improvement (%)","measured improvement (%)",{diag:[-10,80],color:"var(--accent)",op:.45,r:3.2}),
      h("p",{class:"hint"},`Cycles vs measured ns over all ${c.pooled_n} measured programs: Pearson ${fmt(c.pooled_pearson,2)}, Spearman ${fmt(c.pooled_spearman,2)}; ranking variants of one program: mean Spearman ${fmt(c.within_program_mean_spearman,2)}.`)));
  }
  // generations to convergence histogram
  const maxG = Math.max(...P.map(p=>p.generations_to_convergence));

  cards.push(h("div",{class:"card"}, h("h2",{},"Generations to convergence"),
    h("p",{class:"hint"},"Generation of the last improvement in best cost, per program (max "+maxG+")."), barsV(gb,"generations","programs")));
  return cards;
}

function filtered(){
  let idx = P.map((p,i)=>i).filter(i=>{
    const p = P[i];
    if (filters.spelling!=="all" && p.spelling!==filters.spelling) return false;
    if (filters.q && !(p.name+" "+p.kernel).toLowerCase().includes(filters.q)) return false;
    return true;
  });
  const key = {imp_desc:i=>-P[i].improvement_pct, imp_asc:i=>P[i].improvement_pct, conv:i=>-P[i].generations_to_convergence, id:i=>i}[filters.sort];
  return idx.sort((a,b)=>key(a)-key(b));
}

let enginePromise = null;
function loadEngine(setStatus){

    setStatus("Downloading the Python engine (about 10 MB, first time only)...");

      const s = document.createElement("script");
      s.src = PYODIDE_URL + "pyodide.js"; s.onload = res; s.onerror = () => rej(new Error("could not download the Python engine - check your internet connection"));
      document.head.append(s);
    });
    setStatus("Starting Python...");
    const py = await loadPyodide({indexURL: PYODIDE_URL});
    py.FS.mkdirTree("/home/pyodide/eco");
    for (const [name, src] of Object.entries(LIVE_SRC)) py.FS.writeFile("/home/pyodide/eco/" + name, src);
    py.runPython("import sys\nif '/home/pyodide' not in sys.path: sys.path.insert(0, '/home/pyodide')\nfrom eco.live import optimize_json");
    return py.globals.get("optimize_json");
  })().catch(e => { enginePromise = null; throw e; });
  return enginePromise;
}
function live(){
  const root = $("#tab-live");
  const first = Object.keys(SAMPLES)[0];
  const ta = h("textarea",{spellcheck:"false"}); ta.value = SAMPLES[first].src;
  const num = (v, w) => h("input",{type:"number",value:v,style:"width:"+(w||80)+"px"});
  const lo = num(SAMPLES[first].lo), hi = num(SAMPLES[first].hi), gens = num(30,70), pop = num(30,70), seed = num(42,70);
  const sample = h("select",{onchange:e=>{const s=SAMPLES[e.target.value]; ta.value=s.src; lo.value=s.lo; hi.value=s.hi;}}, Object.keys(SAMPLES).map(k=>h("option",{value:k},k)));
  const status = h("span",{class:"status"}, "");
  const btn = h("button",{class:"btn"}, "Optimize live");
  const out = h("div",{style:"margin-top:12px"});
  const field = (l, el) => h("label",{class:"field"}, l, el);
  btn.addEventListener("click", async () => {
    btn.disabled = true; out.replaceChildren();
    try {
      const fn = await loadEngine(t => status.textContent = t);
      status.textContent = "Running the genetic algorithm...";
      await new Promise(r => setTimeout(r, 40));
      const t0 = performance.now();
      const res = JSON.parse(fn(JSON.stringify({source: ta.value, lo:+lo.value, hi:+hi.value, gens:+gens.value, pop:+pop.value, seed:+seed.value})));
      status.textContent = res.ok ? "Done in " + ((performance.now()-t0)/1000).toFixed(1) + " s (computed in your browser)." : "";
      out.replaceChildren(res.ok ? renderLive(res) : h("div",{class:"errbox"}, res.error));
    } catch (e) {
      status.textContent = "";
      out.replaceChildren(h("div",{class:"errbox"}, String(e.message || e)));
    }
    btn.disabled = false;
  });
  root.append(h("div",{class:"card"},
    h("h2",{},"Optimize your own function, live"),
    h("div",{class:"row"}, h("span",{class:"muted"},"Example:"), sample),
    ta,
    h("div",{class:"row",style:"margin-top:10px;align-items:flex-end"},
      field("input min", lo), field("input max", hi), field("generations", gens), field("population", pop), field("seed", seed), btn, status),
    h("p",{class:"hint"},"Use a positive input range if your function uses // (Python floors, the optimizer truncates toward zero). The Python engine is downloaded once from a public CDN."),
    out));
}
function renderLive(r){
  const b = r.baseline, a = r.best;
  const tile = (v,l) => h("div",{class:"card kpi"}, h("div",{class:"v"}, v), h("div",{class:"l"}, l));
  const px = h("select",{onchange:draw}, OBJ.map(([k,t])=>h("option",{value:k},t)));
  const py = h("select",{onchange:draw}, OBJ.map(([k,t],i)=>h("option",{value:k,selected:i===1?"selected":null},t)));
  const pbox = h("div",{});
  function draw(){
    const xi = OBJ.findIndex(o=>o[0]===px.value), yi = OBJ.findIndex(o=>o[0]===py.value);
    const pts = r.population.filter(q=>q[5]).map(q=>({x:q[xi],y:q[yi],front:!!q[4]}));
    pbox.replaceChildren(scatter(pts, OBJ[xi][1], OBJ[yi][1], {xd:xi?0:1,yd:yi?0:1}), legend([["var(--muted)","dominated (valid)"],["var(--bad)","Pareto front"]]));
  }
  const wrap = h("div",{},
    h("div",{class:"grid kpis"},
      tile(fmt(r.improvement_pct)+"%","exec_time improvement (simulated)"),
      tile(b.instr_count+" → "+a.instr_count,"instructions"),
      tile(fmt(b.exec_time,1)+" → "+fmt(a.exec_time,1),"cycles per run"),
      tile(b.arith_ops+" → "+a.arith_ops,"arithmetic ops"),
      tile(b.code_size+" → "+a.code_size,"code size"),
      tile(r.verdict,"output check vs your function")),
    h("div",{class:"card",style:"margin-bottom:12px"},
      h("div",{}, "Best genome: ", r.genome.length ? r.genome.map(g=>h("span",{class:"chip"},g)) : h("span",{class:"chip"},"(unchanged original)")),
      h("div",{class:"muted",style:"margin-top:4px"}, `weighted cost ${fmt(r.best_cost,3)} (original = 1.000) | converged at generation ${r.generations_to_convergence} of ${r.settings.gens} | ${r.front_size} non-dominated, ${r.distinct_points} distinct Pareto point(s)`)),
    h("div",{class:"grid two",style:"margin-bottom:12px"},
      h("div",{class:"card"}, h("h2",{},"Convergence curve"), h("p",{class:"hint"},"Weighted cost per generation (lower is better)."),
        lineChart([{values:r.hist_avg,color:"var(--muted)"},{values:r.hist_best,color:"var(--good)"}],"generation","weighted cost"),
        legend([["var(--good)","best cost"],["var(--muted)","average cost"]])),
      h("div",{class:"card"}, h("h2",{},"Correctness check"), h("p",{class:"hint"},"The optimized code is run on the same inputs as your original function."),
        h("div",{class:"scroll"}, h("table",{class:"t",style:"min-width:420px"},
          h("thead",{}, h("tr",{}, h("th",{},"inputs"), h("th",{},"your function"), h("th",{},"optimized"), h("th",{},"match"))),
          h("tbody",{}, r.checks.map(c=>h("tr",{}, h("td",{style:"text-align:left"}, r.args.map(x=>x+"="+c.inputs[x]).join(", ")),
            h("td",{}, "["+c.expected.join(", ")+"]"), h("td",{}, "["+c.optimized.join(", ")+"]"), h("td",{class:c.match?"ok":"fail"}, c.match?"yes":"NO"))))))) ),
    h("div",{class:"card",style:"margin-bottom:12px"}, h("h2",{},"Three-address code"),
      h("div",{class:"cols"},
        h("div",{}, h("p",{class:"hint"},`before (${r.tac_before.length} instructions)`), h("pre",{}, r.tac_before.join("\n"))),
        h("div",{}, h("p",{class:"hint"},`after (${r.tac_after.length} instructions)`), h("pre",{}, r.tac_after.join("\n"))))),
    h("div",{class:"card"}, h("h2",{},"Pareto analysis of the final population"),
      h("div",{class:"row"}, px, h("span",{class:"muted"},"vs"), py), pbox,
      h("div",{class:"scroll"}, h("table",{class:"t",style:"margin-top:8px;min-width:560px"},
        h("thead",{}, h("tr",{}, h("th",{},"best at"), h("th",{},"genome"), h("th",{},"time"), h("th",{},"instr"), h("th",{},"size"), h("th",{},"ops"), h("th",{},"ties"))),
        h("tbody",{}, r.pareto.map(e=>h("tr",{}, h("td",{style:"text-align:left"},e.label), h("td",{style:"text-align:left"},e.genome.join(" > ")||"(none)"),
          h("td",{},fmt(e.fitness.exec_time,1)), h("td",{},e.fitness.instr_count), h("td",{},e.fitness.code_size), h("td",{},e.fitness.arith_ops), h("td",{},e.tied))))))));
  draw();
  return wrap;
}

// ------------------------------------------------------------------ boot
$("#subtitle").textContent = `${M.dataset} | ${P.length} programs | population ${M.population_size} | ${M.generations} generations | seed ${M.seed}`;
overview(); explorer(); live(); brief();
document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("active",x===b));
  document.querySelectorAll("section.tab").forEach(s=>s.classList.toggle("active",s.id==="tab-"+b.dataset.tab));
}));
$("#themeBtn").addEventListener("click",()=>{
  const root = document.documentElement, dark = getComputedStyle(root).getPropertyValue("--bg").trim()==="#10161d";
  root.setAttribute("data-theme", dark?"light":"dark");
});
})();
</script>
